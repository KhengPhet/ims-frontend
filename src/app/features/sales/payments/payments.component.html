<div class="p-6 space-y-6">

    <!-- Page header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Payments</h1>
            <p class="text-sm text-gray-500 mt-1">Review payment transactions and their processing status.</p>
        </div>
        <app-button variant="secondary" [icon]="icons.download">Export</app-button>
    </div>

    <!-- Payments table -->
    <app-data-table
        [data]="payments"
        [columns]="columns"
        [searchKeys]="['paymentId', 'order', 'customer']"
        title="Payment Transactions"
        [description]="payments.length + ' recent transactions'"
        searchPlaceholder="Search payments..."
        [filterable]="true"
        [filterOptions]="filterOptions"
        [filterFn]="filterByStatus"
        [pageSize]="10"
        [actions]="false">
        <ng-template tableCell="method" let-row>
            <span class="inline-flex items-center gap-1.5 text-gray-600">
                <span class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center">
                    <lucide-icon [img]="methodIcon(row.method)" size="14" class="text-gray-500"></lucide-icon>
                </span>
                {{ row.method }}
            </span>
        </ng-template>
    </app-data-table>
</div>
