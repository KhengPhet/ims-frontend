<div class="p-6 space-y-6">

    <!-- Page header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Stock In</h1>
            <p class="text-sm text-gray-500 mt-1">Track incoming inventory, receipts and supplier deliveries.</p>
        </div>
        <div class="flex items-center gap-3">
            <app-button variant="secondary" [icon]="icons.download">Export</app-button>
            <app-button [icon]="icons.plus" (clicked)="addStockIn()">New Stock In</app-button>
        </div>
    </div>

    <!-- Stat cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">
        @for (card of stats; track card.title) {
            <app-stat-card [title]="card.title" [value]="card.value" [icon]="card.icon" [iconBg]="card.iconBg" [iconColor]="card.iconColor" [note]="card.note"></app-stat-card>
        }
    </div>

    <!-- Records table -->
    <app-data-table
        [data]="records()"
        [columns]="columns"
        [searchKeys]="['reference', 'product', 'sku', 'supplier']"
        title="Stock In Records"
        [description]="records().length + ' recent receipts'"
        searchPlaceholder="Search receipts..."
        [pageSize]="8"
        [actions]="true"
        [showView]="false"
        [showDelete]="false"
        (edit)="editStockIn($event)">
        <ng-template tableCell="product" let-row>
            <div class="min-w-0">
                <p class="font-medium text-gray-800 truncate">{{ row.product }}</p>
                <p class="text-xs text-gray-400">{{ row.sku }}</p>
            </div>
        </ng-template>
        <ng-template tableCell="quantity" let-row>
            <span class="font-semibold text-gray-800">{{ row.quantity.toLocaleString() }} {{ row.unit }}</span>
        </ng-template>
    </app-data-table>
</div>
