<div class="relative">

    <!-- Bell button -->
    <button
        type="button"
        (click)="toggle()"
        aria-label="Notifications"
        class="relative p-2 text-gray-600 hover:text-blue-600 hover:bg-gray-100 rounded-lg transition">
        <lucide-icon [img]="icons.bell" size="20"></lucide-icon>
        @if (unreadCount > 0) {
            <span class="absolute top-0.5 -right-0.5 bg-red-500 text-white text-[10px] rounded-full flex items-center justify-center border-2 border-white" style="min-width:18px;height:18px;padding:0 3px;">
                {{ unreadCount > 9 ? '9+' : unreadCount }}
            </span>
        }
    </button>

    <!-- Panel -->
    @if (open) {
        <div class="absolute z-50 right-0 mt-2 w-[min(20rem,calc(100vw-2rem))] sm:w-96 rounded-xl border border-gray-200 bg-white shadow-xl overflow-hidden">

            <!-- Header -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
                <div>
                    <h3 class="font-semibold text-gray-800">Notifications</h3>
                    <p class="text-xs text-gray-400 mt-0.5">{{ unreadCount }} unread</p>
                </div>
                @if (unreadCount > 0) {
                    <button
                        type="button"
                        (click)="markAllRead()"
                        class="inline-flex items-center gap-1 text-xs font-medium text-blue-600 hover:text-blue-700 transition">
                        <lucide-icon [img]="icons.check" size="13"></lucide-icon>
                        Mark all as read
                    </button>
                }
            </div>

            <!-- List -->
            <div class="max-h-96 overflow-y-auto divide-y divide-gray-50">
                @for (item of notifications; track item.id) {
                    <button
                        type="button"
                        (click)="markRead(item)"
                        class="w-full flex items-start gap-3 px-5 py-3.5 text-left transition hover:bg-gray-50"
                        [class]="item.read ? '' : 'bg-blue-50/50'">
                        <span class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 {{ styleFor(item.type).bg }}">
                            <lucide-icon [img]="styleFor(item.type).icon" size="16" class="{{ styleFor(item.type).color }}"></lucide-icon>
                        </span>
                        <span class="min-w-0 flex-1">
                            <span class="flex items-center justify-between gap-2">
                                <span class="text-sm truncate" [class]="item.read ? 'font-normal text-gray-600' : 'font-medium text-gray-800'">{{ item.title }}</span>
                                <span class="w-2 h-2 rounded-full flex-shrink-0" [class]="item.read ? 'bg-transparent' : 'bg-blue-500'"></span>
                            </span>
                            <span class="block text-xs text-gray-500 mt-0.5 leading-relaxed">{{ item.description }}</span>
                            <span class="block text-[11px] text-gray-400 mt-1">{{ item.time }}</span>
                        </span>
                    </button>
                } @empty {
                    <div class="flex flex-col items-center justify-center py-12 px-6 text-center">
                        <span class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mb-3">
                            <lucide-icon [img]="icons.inbox" size="20" class="text-gray-400"></lucide-icon>
                        </span>
                        <p class="text-sm font-medium text-gray-600">No notifications</p>
                        <p class="text-xs text-gray-400 mt-1">You're all caught up.</p>
                    </div>
                }
            </div>

            <!-- Footer -->
            <button
                type="button"
                (click)="viewAll()"
                class="w-full flex items-center justify-center gap-1.5 px-5 py-3 text-xs font-medium text-blue-600 hover:text-blue-700 hover:bg-gray-50 border-t border-gray-100 transition">
                View all notifications
                <lucide-icon [img]="icons.arrow" size="13"></lucide-icon>
            </button>
        </div>
    }
</div>
