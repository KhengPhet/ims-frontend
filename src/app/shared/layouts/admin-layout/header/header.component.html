<header class="h-16 bg-white shadow flex items-center justify-between px-4 sm:px-6 gap-4">

    <!-- Left -->
    <div class="flex items-center gap-4 min-w-0">
        <h1 class="text-lg sm:text-xl font-bold text-gray-800 truncate">
            Inventory Management System
        </h1>
    </div>

    <!-- Right -->
    <div class="flex items-center gap-2 sm:gap-5">

        <!-- Search -->
        <div class="relative hidden md:block">
            <lucide-icon [img]="icons.search" size="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></lucide-icon>
            <input
                type="text"
                placeholder="Search anything..."
                class="pl-9 pr-3 h-10 text-sm bg-gray-50 border border-gray-200 rounded-lg w-52 lg:w-64 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder:text-gray-300"
            />
        </div>

        <!-- Notifications -->
        <app-notifications></app-notifications>

        <!-- User dropdown -->
        <app-dropdown [items]="menuItems" align="right" (selected)="onMenuSelect($event)">
            <div class="flex items-center gap-3 cursor-pointer p-1 rounded-lg hover:bg-gray-50 transition" dropdownTrigger>
                <img [src]="avatar" class="w-9 h-9 rounded-full object-cover" alt="Avatar">
                <div class="hidden sm:block text-left">
                    <p class="font-semibold text-gray-800 leading-tight text-sm">{{ displayName }}</p>
                    <p class="text-xs text-gray-500">{{ roleLabel }}</p>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="hidden sm:block w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </app-dropdown>
    </div>
</header>
